name: Release

on:
    schedule:
        - cron: 0 0 * * 0

    release:
        types: [published]

    workflow_dispatch:
        inputs:
            force:
                description: Force build & release?
                type: boolean
                required: true
                default: false

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        continue-on-error: true
        env:
            X_APP_VERSION: ""
            X_TAG_NAME: ""
            X_REQUIRES_BUILD: ""
        steps:
            - uses: actions/checkout@v4

            - name: 🚧 Prerequistes
              run: |
                  sudo apt-get update
                  sudo apt-get install -y podman

            - name: 🔢 Get version
              run: |
                  version=$(./scripts/version.sh | xargs)
                  echo "X_APP_VERSION=${version}" >> $GITHUB_ENV
                  echo "X_TAG_NAME=v${version}" >> $GITHUB_ENV

            - name: ♻️ Check for existing releases
              run: |
                  requires_build=$(./scripts/requires-build.sh $X_TAG_NAME | xargs)
                  echo "X_REQUIRES_BUILD=${requires_build}" >> $GITHUB_ENV
              env:
                  X_FORCE_BUILD: ${{ inputs.force }}

            - name: 🔨 Build executables
              run: |
                  find ./scripts -type f -name "*.sh" -exec chmod +x {} \;
                  ./scripts/build-podman.sh $X_APP_VERSION
              if: ${{ env.X_REQUIRES_BUILD == 'yes' }}

            - name: 🚀 Upload executables
              uses: ncipollo/release-action@v1
              if: ${{ env.X_REQUIRES_BUILD == 'yes' }}
              with:
                  body: "IntelliJ IDEA Community Version: `${{ env.X_APP_VERSION }}`"
                  tag: ${{ env.X_TAG_NAME }}
                  artifacts: "dist/*"
                  generateReleaseNotes: false
                  draft: false
                  artifactErrorsFailBuild: true
                  allowUpdates: true
                  replacesArtifacts: true
                  makeLatest: true

            - name: 🗑️ Delete old releases
              if: ${{ env.X_REQUIRES_BUILD == 'yes' }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  tags=$(gh release list --limit 1000 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[1:] | .[].tagName')
                  for tag in $tags; do
                    gh release delete "$tag" --yes
                  done
